backend:
  name: git-gateway
  branch: main

media_folder: images
public_folder: /images

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Summary, name: summary, widget: string, hint: "Short description shown in post listings (1-2 sentences)" }
      - { label: Body, name: body, widget: markdown }
