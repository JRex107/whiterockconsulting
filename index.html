<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Rock Consulting</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // If this is an identity callback (invite, recovery, login), stay here and let the widget handle it
    var hash = window.location.hash;
    var isIdentityCallback = hash.includes('invite_token') || 
                             hash.includes('recovery_token') || 
                             hash.includes('access_token') ||
                             hash.includes('confirmation_token');

    if (!isIdentityCallback) {
      // Normal visitor - redirect immediately to the actual site
      window.location.replace('/site.html');
    }

    // After identity actions complete, redirect to admin
    window.addEventListener('load', function() {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('login', function() {
          document.location.href = '/admin/';
        });
        window.netlifyIdentity.on('signup', function() {
          document.location.href = '/admin/';
        });
      }
    });
  </script>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Loading...</p>
</body>
</html>
